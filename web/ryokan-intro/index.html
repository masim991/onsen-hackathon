<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#20171a">
  <meta name="description" content="료칸의 문을 열고 일본 온천 지도를 펼쳐 보세요.">
  <title>료칸에 들어서다 | 온천 한눈에</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="prefetch" href="../map-explore.html">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/",
      "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.15.1/index.js"
    }
  }
  </script>
  <script type="module" src="./main.js"></script>
</head>
<body>
  <div class="scroll-track" aria-hidden="true"></div>
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <div class="map-reveal" id="map-reveal" aria-hidden="true"></div>
  <a class="direct-link" id="direct" href="../map-explore.html?lang=ko">지도로 바로 가기 <span aria-hidden="true">↗</span></a>
  <nav class="language-switch" aria-label="Language">
    <a href="?lang=ko" data-lang="ko">한국어</a>
    <a href="?lang=ja" data-lang="ja">日本語</a>
    <a href="?lang=en" data-lang="en">English</a>
  </nav>
  <main class="intro" id="intro">
    <div class="intro__content">
      <p class="intro__brand">온천 한눈에 <span lang="ja">温泉ひとめぐり</span></p>
      <h1>문을 열면,<br>온천 여행이 시작됩니다.</h1>
      <p class="intro__description">다다미방의 지도를 펼쳐 여행할 곳을 골라보세요.</p>
      <p class="scroll-cue" id="scroll-cue"><span class="scroll-cue__line" aria-hidden="true"></span><span>아래로 스크롤해 입장하기</span></p>
      <a class="mobile-preview-link" id="mobile-preview" href="./mobile.html?lang=ko">모바일 화면 보기 <span aria-hidden="true">↗</span></a>
      <p class="intro__hint" id="status" role="status" aria-live="polite">공간을 준비하고 있습니다.</p>
    </div>
  </main>
  <div class="scene-ui" id="scene-ui" hidden>
    <p class="scene-ui__caption" id="caption" aria-live="polite">료칸으로 들어갑니다</p>
    <p class="scene-ui__progress" id="progress" aria-hidden="true">01 / 04</p>
  </div>
  <noscript><p class="no-script">JavaScript를 켜야 3D 입장을 볼 수 있습니다. <a href="../map-explore.html?lang=ko">온천 지도 보기</a></p></noscript>
  <script>
    setTimeout(() => {
      if (document.documentElement.classList.contains('ready')) return;
      const lang = new URLSearchParams(location.search).get('lang');
      document.querySelector('#status').textContent = lang === 'ja' ? '3D空間を読み込めませんでした。地図へ進んでください。' : lang === 'en' ? 'The 3D room could not load. Please open the map.' : '3D 공간을 불러오지 못했습니다. 지도로 바로 이동해 주세요.';
      document.querySelector('#direct').classList.add('direct-link--fallback');
    }, 9000);
  </script>
</body>
</html>
