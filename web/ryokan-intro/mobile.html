<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#20171a">
  <title>모바일 화면 보기 | 온천 한눈에</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#20171a;color:#f1e7d3;font-family:"Gowun Dodum","Yu Gothic",sans-serif}
    body{display:grid;grid-template-rows:auto 1fr;min-height:100dvh;gap:16px;padding:16px}
    header{display:flex;align-items:center;justify-content:space-between;gap:20px;max-width:920px;width:100%;margin:auto}
    h1{margin:0;font-size:15px;font-weight:500;letter-spacing:.04em}a{color:#d6a56a;text-decoration:none;font-size:13px}a:focus-visible{outline:2px solid #d6a56a;outline-offset:4px}
    .phone{width:min(390px,calc((100dvh - 88px)*390/844),100%);aspect-ratio:390/844;margin:auto;border:6px solid #594941;border-radius:29px;overflow:hidden;box-shadow:0 28px 80px #080508;min-height:0}
    iframe{display:block;width:100%;height:100%;border:0;background:#20171a}
    @media(max-width:600px){body{padding:0;gap:0}header{padding:12px 16px}.phone{width:100%;height:calc(100dvh - 48px);aspect-ratio:auto;border:0;border-radius:0;box-shadow:none}}
  </style>
</head>
<body>
  <header><h1 id="title">모바일 화면 미리보기</h1><a id="back" href="./index.html?lang=ko">← 인트로로 돌아가기</a></header>
  <div class="phone"><iframe id="preview" title="모바일 화면 미리보기" loading="eager" allow="autoplay"></iframe></div>
  <script>
    const requested = new URLSearchParams(location.search).get('lang');
    const lang = ['ko','ja','en'].includes(requested) ? requested : 'ko';
    document.documentElement.lang = lang;
    document.querySelector('#preview').src = `./index.html?lang=${lang}&preview=1`;
    document.querySelector('#back').href = `./index.html?lang=${lang}`;
    document.querySelector('#title').textContent = {ko:'모바일 화면 미리보기',ja:'モバイル画面のプレビュー',en:'Mobile preview'}[lang];
    document.querySelector('#back').textContent = {ko:'← 인트로로 돌아가기',ja:'← イントロに戻る',en:'← Back to intro'}[lang];
  </script>
</body>
</html>
