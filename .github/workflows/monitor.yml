name: monitor
on:
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch: {}
concurrency:
  group: monitor
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HAS_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Skip when the service key secret is not registered yet
        if: env.HAS_KEY != 'true'
        run: echo "::notice::SUPABASE_SERVICE_ROLE_KEY secret is not set - skipping (see tools/monitor/USER-TODO.md)"
      - if: env.HAS_KEY == 'true'
        run: node tools/monitor/worker.mjs --run --sink rest --limit 120
        env:
          SUPABASE_URL: https://frncsllpkxrsgxyqsfwd.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AUTO_APPLY: ${{ vars.AUTO_APPLY || 'strict' }}
          AUTO_PUBLISH_NOTICES: ${{ vars.AUTO_PUBLISH_NOTICES || 'off' }}
